<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financeiro - RAJJ</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    :root { --ink:#18202f; --muted:#667085; --panel:rgba(255,255,255,.88); --line:rgba(24,32,47,.16); --brand:#176b87; --brand-dark:#0f4c5c; --red:#d92d20; --yellow:#fdb022; --green:#12b76a; --orange:#f97316; --shadow:0 24px 70px rgba(15,76,92,.18); }
    body.finance-page { display:block; min-height:100vh; padding:0; color:var(--ink); background:radial-gradient(circle at 12% 18%,rgba(249,216,220,.95),transparent 28%),radial-gradient(circle at 86% 12%,rgba(215,245,242,.95),transparent 30%),linear-gradient(135deg,#f8e4d8 0%,#dff6f3 48%,#f7efd4 100%); }
    .finance-shell { width:min(1480px,calc(100% - 32px)); margin:0 auto; padding:28px 0 44px; }
    .finance-topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; color:var(--ink); }
    .finance-kicker { margin-bottom:6px; color:var(--brand-dark); font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .finance-topbar h1 { margin:0 0 8px; font-size:clamp(34px,5vw,68px); line-height:.95; letter-spacing:-.06em; color:var(--ink); }
    .finance-topbar p { max-width:720px; color:var(--muted); font-size:16px; }
    .topbar-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .finance-button,.ghost-button,.icon-button { width:auto; border:0; cursor:pointer; font-weight:800; border-radius:999px; transition:transform .18s ease,box-shadow .18s ease,background .18s ease; }
    .finance-button { padding:12px 18px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); box-shadow:0 12px 30px rgba(23,107,135,.28); }
    .ghost-button { padding:11px 16px; color:var(--brand-dark); background:rgba(255,255,255,.54); border:1px solid rgba(15,76,92,.22); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .finance-button:hover,.ghost-button:hover,.icon-button:hover { transform:translateY(-2px); box-shadow:0 16px 34px rgba(15,76,92,.18); }
    .finance-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr); gap:20px; align-items:start; }
    .calendar-card,.side-card,.form-card { border:1px solid rgba(255,255,255,.72); background:var(--panel); border-radius:28px; box-shadow:var(--shadow); backdrop-filter:blur(14px); }
    .calendar-card { overflow:hidden; }
    .calendar-hero { display:grid; grid-template-columns:minmax(160px,.5fr) minmax(0,1fr); min-height:170px; border-bottom:1px solid var(--line); background:linear-gradient(120deg,rgba(249,216,220,.9),rgba(215,245,242,.9)),#fff; }
    .year-panel { display:flex; align-items:center; justify-content:center; padding:24px; color:var(--brand-dark); font-size:clamp(62px,11vw,132px); font-weight:900; letter-spacing:-.1em; line-height:.8; }
    .month-panel { display:flex; flex-direction:column; justify-content:center; gap:16px; padding:24px; border-left:1px solid var(--line); }
    .month-title { margin:0; color:#fff; text-shadow:0 2px 18px rgba(15,76,92,.32); font-size:clamp(34px,5vw,58px); line-height:.95; letter-spacing:-.04em; }
    .calendar-nav { display:flex; gap:8px; flex-wrap:wrap; }
    .icon-button { min-width:42px; padding:10px 13px; color:var(--brand-dark); background:rgba(255,255,255,.72); border:1px solid rgba(15,76,92,.2); }
    .calendar-weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
    .calendar-weekday { padding:18px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:center; font-size:13px; font-weight:900; color:var(--ink); background:rgba(255,255,255,.72); }
    .calendar-day { min-height:116px; padding:10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:rgba(255,255,255,.68); cursor:pointer; text-align:left; color:var(--ink); }
    .calendar-day:hover,.calendar-day.is-selected { outline:3px solid rgba(23,107,135,.25); outline-offset:-3px; }
    .calendar-day.is-outside { color:#b8bec8; background:rgba(255,255,255,.38); }
    .calendar-day.is-today .day-number { background:var(--brand-dark); color:#fff; }
    .calendar-day.is-overdue { background:linear-gradient(135deg,rgba(217,45,32,.24),rgba(255,255,255,.78)); }
    .calendar-day.is-due-soon { background:linear-gradient(135deg,rgba(253,176,34,.32),rgba(255,255,255,.8)); }
    .calendar-day.is-paid { background:linear-gradient(135deg,rgba(18,183,106,.24),rgba(255,255,255,.8)); }
    .calendar-day.is-renegotiation { background:linear-gradient(135deg,rgba(249,115,22,.25),rgba(255,255,255,.8)); }
    .day-number { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:999px; font-weight:900; }
    .day-total { display:block; margin-top:10px; font-size:12px; font-weight:900; color:var(--brand-dark); }
    .day-dots { display:flex; gap:5px; flex-wrap:wrap; margin-top:10px; }
    .dot { width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.72); }
    .dot-red { background:var(--red); } .dot-yellow { background:var(--yellow); } .dot-green { background:var(--green); } .dot-orange { background:var(--orange); }
    .side-stack { display:grid; gap:16px; } .side-card,.form-card { padding:18px; }
    .side-card h2,.form-card h2 { margin:0 0 12px; color:var(--ink); font-size:19px; letter-spacing:-.02em; }
    .filters,.account-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .filters label,.account-form label { color:var(--ink); font-size:13px; font-weight:900; }
    .filters input,.filters select,.account-form input,.account-form select,.account-form textarea { width:100%; margin-top:6px; padding:11px 12px; border:1px solid rgba(24,32,47,.18); border-radius:14px; color:var(--ink); background:rgba(255,255,255,.8); font-size:14px; }
    .span-2 { grid-column:1/-1; } .account-form textarea { min-height:90px; resize:vertical; }
    .legend { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; color:var(--muted); font-size:13px; font-weight:700; }
    .legend-item { display:flex; align-items:center; gap:8px; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .summary-box { padding:12px; border-radius:18px; background:rgba(255,255,255,.66); border:1px solid rgba(24,32,47,.1); }
    .summary-box strong { display:block; font-size:18px; color:var(--ink); } .summary-box span { color:var(--muted); font-size:12px; font-weight:800; }
    .account-list { display:grid; gap:10px; max-height:420px; overflow:auto; padding-right:4px; }
    .account-card { padding:13px; border-radius:18px; background:rgba(255,255,255,.72); border:1px solid rgba(24,32,47,.12); }
    .account-card header { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px; }
    .account-card h3 { margin:0; font-size:15px; color:var(--ink); } .account-card small { display:block; color:var(--muted); line-height:1.45; }
    .pill-row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
    .pill { display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; font-size:11px; font-weight:900; color:#fff; }
    .pill-red{background:var(--red)} .pill-yellow{background:var(--yellow);color:#4a3000} .pill-green{background:var(--green)} .pill-orange{background:var(--orange)} .pill-blue{background:var(--brand)}
    .card-actions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:10px; }
    .card-actions button { width:100%; padding:8px 6px; border-radius:12px; font-size:12px; background:#eef8f6; color:var(--brand-dark); box-shadow:none; }
    .form-actions { display:flex; gap:10px; justify-content:flex-end; } .empty-text { padding:16px; color:var(--muted); text-align:center; font-weight:700; }
    @media (max-width:1080px){ .finance-grid{grid-template-columns:1fr}.calendar-day{min-height:96px} }
    @media (max-width:720px){ .finance-topbar{flex-direction:column}.topbar-actions{justify-content:flex-start}.calendar-hero{grid-template-columns:1fr}.month-panel{border-left:0;border-top:1px solid var(--line)}.calendar-day{min-height:78px;padding:7px}.day-total{display:none}.filters,.summary-grid,.account-form{grid-template-columns:1fr}.card-actions{grid-template-columns:repeat(2,minmax(0,1fr))} }
  </style>
</head>
<body class="finance-page">
  <main class="finance-shell">
    <header class="finance-topbar">
      <div><p class="finance-kicker">Financeiro RAJJ</p><h1>Calendario de contas</h1><p>Visualize vencimentos por dia, navegue entre meses e cadastre contas a pagar ou receber com lembretes por e-mail.</p></div>
      <div class="topbar-actions"><a class="ghost-button" href="cadastro-aluno.html">Alunos</a><a class="ghost-button" href="usuarios.html">Usuarios</a><button type="button" class="finance-button" id="logoutButton">Sair</button></div>
    </header>
    <section class="finance-grid">
      <article class="calendar-card">
        <div class="calendar-hero"><div class="year-panel" id="calendarYear">2026</div><div class="month-panel"><h2 class="month-title" id="calendarMonth">Maio</h2><div class="calendar-nav"><button type="button" class="icon-button" id="prevYear">Ano anterior</button><button type="button" class="icon-button" id="prevMonth">Mes anterior</button><button type="button" class="icon-button" id="todayButton">Hoje</button><button type="button" class="icon-button" id="nextMonth">Proximo mes</button><button type="button" class="icon-button" id="nextYear">Proximo ano</button></div></div></div>
        <div class="calendar-weekdays" id="calendarWeekdays"></div><div class="calendar-grid" id="calendarGrid"></div>
      </article>
      <aside class="side-stack">
        <section class="side-card"><h2>Filtros</h2><div class="filters"><label>Tipo<select id="filtroTipo"><option value="TODOS">Todos</option><option value="PAGAR">A pagar</option><option value="RECEBER">A receber</option></select></label><label>Status<select id="filtroStatus"><option value="TODOS">Todos</option><option value="VENCIDA">Vencidas</option><option value="VENCENDO">A vencer</option><option value="PAGA">Pagas</option><option value="REN">Renegociacao</option><option value="ABERTA">Abertas</option></select></label><label class="span-2">Buscar<input type="search" id="filtroBusca" placeholder="Descricao, categoria, e-mail ou observacoes" /></label></div><div class="legend"><span class="legend-item"><i class="dot dot-red"></i> Vencida</span><span class="legend-item"><i class="dot dot-yellow"></i> Proxima</span><span class="legend-item"><i class="dot dot-green"></i> Paga</span><span class="legend-item"><i class="dot dot-orange"></i> Renegociacao</span></div></section>
        <section class="side-card"><h2>Resumo do mes</h2><div class="summary-grid" id="summaryGrid"></div></section>
        <section class="side-card"><h2 id="selectedDayTitle">Contas do mes</h2><div class="account-list" id="accountList"></div></section>
        <section class="form-card"><h2 id="formTitle">Nova conta</h2><form id="accountForm" class="account-form"><input type="hidden" id="contaId" /><label>Tipo<select id="tipo" required><option value="PAGAR">A pagar</option><option value="RECEBER">A receber</option></select></label><label>Status<select id="status"><option value="ABERTA">Aberta</option><option value="PAGA">Paga</option><option value="REN">Renegociacao</option></select></label><label class="span-2">Descricao<input type="text" id="descricao" required placeholder="Ex.: Aluguel, mensalidade, fornecedor" /></label><label>Valor<input type="number" step="0.01" min="0.01" id="valor" required /></label><label>Vencimento<input type="date" id="dataVencimento" required /></label><label>Recorrencia<select id="recorrencia"><option value="NENHUMA">Nenhuma</option><option value="MENSAL">Mensal</option><option value="SEMANAL">Semanal</option><option value="ANUAL">Anual</option></select></label><label>Categoria<input type="text" id="categoria" placeholder="Ex.: Escola, transporte" /></label><label class="span-2">E-mail de cobranca<input type="email" id="emailCobranca" placeholder="destinatario@email.com" /></label><label class="span-2">Observacoes<textarea id="observacoes" placeholder="Detalhes, combinados, forma de pagamento..."></textarea></label><div class="form-actions span-2"><button type="button" class="ghost-button" id="clearFormButton">Cancelar</button><button type="submit" class="finance-button">Salvar conta</button></div></form></section>
      </aside>
    </section>
  </main>
  <script src="assets/js/app-core.js"></script>
  <script src="assets/js/contas.js"></script>
</body>
</html>
