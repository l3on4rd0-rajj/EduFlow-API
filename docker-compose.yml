services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: api-node-app:${APP_IMAGE_TAG:-1.0.1}
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/willdb
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_for_local_docker}
      - RESET_PASSWORD_SECRET=${RESET_PASSWORD_SECRET:-change_this_reset_secret_for_local_docker}
      - MFA_CHALLENGE_SECRET=${MFA_CHALLENGE_SECRET:-change_this_mfa_secret_for_local_docker}
      - APP_URL=http://localhost:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
      - SERVE_STATIC_FRONTEND=false
      - EXPOSE_API_DOCS=true
      - SMTP_TLS_REJECT_UNAUTHORIZED=false
      - ALLOW_INSECURE_SMTP_TLS=true
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: api-node-nginx:${APP_IMAGE_TAG:-1.0.1}
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=willdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-init:
    image: mongo:6.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mongosh --host mongo --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }]}).ok }"
        >/dev/null 2>&1; do
        echo 'Waiting for mongo replica set to be ready...' ; sleep 2;
        done
    restart: "no"

volumes:
  mongo-data:
    driver: local
